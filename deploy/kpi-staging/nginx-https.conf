server {
    listen 80;
    server_name kpi-staging.100-51-11-48.sslip.io;

    location /.well-known/acme-challenge/ {
        root /home/ec2-user/iconic_kpi_staging/var/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kpi-staging.100-51-11-48.sslip.io;

    ssl_certificate /etc/letsencrypt/live/kpi-staging.100-51-11-48.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kpi-staging.100-51-11-48.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    auth_basic "Iconic KPI Private Staging";
    auth_basic_user_file /home/ec2-user/iconic_kpi_staging/config/staging.htpasswd;

    client_max_body_size 10m;

    location /static/ {
        alias /home/ec2-user/iconic_kpi_staging/var/static/;
        access_log off;
        expires 1h;
    }

    location /media/ {
        alias /home/ec2-user/iconic_kpi_staging/var/media/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8011;
    }
}
