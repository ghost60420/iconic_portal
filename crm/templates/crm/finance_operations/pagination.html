{% if page.paginator.num_pages > 1 %}<div class="fc-pagination"><span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div class="ops-page-links">{% if page.has_previous %}<a class="fc-btn" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page.previous_page_number }}">Previous</a>{% endif %}{% if page.has_next %}<a class="fc-btn" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page.next_page_number }}">Next</a>{% endif %}</div></div>{% endif %}
