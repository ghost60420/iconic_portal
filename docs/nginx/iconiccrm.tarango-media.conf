server {
    listen 80 default_server;
    server_name 3.84.200.98;

    client_max_body_size 50M;

    location /static/ {
        alias /home/ec2-user/iconic_portal/staticfiles/;
    }

    location ^~ /media/financial_core/ { return 404; }
    location ^~ /media/accounting/ { return 404; }
    location ^~ /media/accounting_docs/ { return 404; }

    location ^~ /media/ {
        auth_request /_crm_production_media_check;
        alias /home/ec2-user/iconic_portal/media/;
        disable_symlinks on;
        add_header Cache-Control "private, no-store, no-cache, max-age=0" always;
        add_header Vary Cookie always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /_crm_production_media_check {
        internal;
        proxy_pass http://127.0.0.1:8000$request_uri;
        proxy_method HEAD;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Only this internal check is HTTPS-marked, including the existing IP vhost.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_cache off;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 404 =403 @crm_production_media_denied;
    }

    location @crm_production_media_denied {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}



server {
    server_name femline.ca www.femline.ca;

    client_max_body_size 50M;

