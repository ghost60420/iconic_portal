        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/femline.ca/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/femline.ca/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}




server {
    if ($host = www.femline.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = femline.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name femline.ca www.femline.ca;
    return 301 https://$host$request_uri;




}
